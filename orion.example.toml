# Orion policy. Copy to ~/.config/orion/orion.toml (or pass --config / set
# ORION_CONFIG). Every key is optional; the values shown are the defaults
# unless noted otherwise.

# What happens to tools that have no entry under [tools], by risk level:
#   allow  run without asking
#   ask    stop and ask you first (in `orion chat` / `orion call`); with no
#          human present (`orion serve`) this acts as deny
#   deny   never; the tool is not even offered to the AI
[defaults]
read = "allow"      # observe the machine
write = "ask"       # change files
execute = "ask"     # run programs

# Per-tool overrides. Run `orion tools` to see the result.
[tools]
# fs_write = "allow"
# proc_run = "deny"
# gpu_info = "deny"

[fs]
# Trees the AI may read (write roots are readable too).
read_roots = ["~"]
# Trees the AI may write. This is a hard limit: approving a write outside
# these roots is not possible.
write_roots = ["~/orion-workspace"]
max_read_bytes = 1048576

[proc]
# Pre-approved programs, matched exactly against the requested command
# ("*" matches any). With proc_run = "ask", these run without a prompt and
# anything else asks you. With proc_run = "allow", only these run at all.
allowed_commands = []
# allowed_commands = ["uname", "df", "free", "nvidia-smi", "git"]
timeout_secs = 30
max_output_bytes = 65536   # per stream
# Processes proc_signal never stops, by name: the ones the session, the network
# or the machine stand on. Orion itself and its parents are never stopped either.
protected = ["systemd", "systemd-*", "init", "sshd", "sshd-*", "dbus-daemon", "dbus-broker*", "polkitd",
             "NetworkManager", "Xorg", "Xwayland", "gnome-shell", "kwin_*", "plasmashell", "gdm*", "sddm*",
             "lightdm*", "login", "agetty", "orion"]

# How Orion gets root for system services and packages: "auto" (nothing when
# Orion runs as root; otherwise services are tried directly, which polkit may
# allow, then through the privileged helper if it runs, else `sudo -n`),
# "helper", "sudo", "pkexec" (a graphical password prompt), or "none".
[admin]
elevate = "auto"

# systemd units (svc_list, svc_status, svc_control).
[services]
allowed = []                    # units svc_control may act on without asking, e.g.
                                # ["ollama.service", "llama-server.service"]
# Units no approval can touch. `*` is a wildcard.
protected = ["orion.*", "orion-*", "ssh.service", "sshd.service", "systemd-*", "dbus*", "polkit.service",
             "NetworkManager.service", "systemd-networkd.service", "display-manager.service", "gdm*.service",
             "sddm.service", "lightdm.service", "getty@*", "user@*", "user-runtime-dir@*", "*.target",
             "debug-shell.service", "emergency.service", "rescue.service", "serial-getty@*", "container-getty@*",
             "autovt@*", "console-getty.service"]

# The package manager (pkg_list, pkg_search, pkg_info, pkg_install, pkg_remove).
[packages]
manager = "auto"                # apt, dnf, zypper or pacman
allowed = []                    # pkg_install without asking, e.g. ["python3-*", "jq"]
# Packages no approval can remove, even as dependents. Packages the system
# marks essential or required are protected as well.
protected = ["sudo", "systemd", "systemd-*", "openssh-server", "openssh", "linux", "linux-image-*", "kernel",
             "kernel-core", "kernel-default", "bubblewrap", "apt", "dnf", "zypper", "pacman", "dpkg", "rpm", "glibc",
             "libc6", "bash"]
# update_apply runs that need no approval: "ask" (none), "security" (security-only
# updates), "all" (any update that removes nothing) or "full" (any update, also
# ones that remove or replace packages; protected ones never). With
# update_apply = "allow", where nobody is asked, anything else is refused.
updates = "ask"
timeout_secs = 900

# Local inference servers and the VRAM they share (model_status, model_load, ...).
[models]
servers = []                    # besides chat.local.base_url, e.g. ["http://127.0.0.1:11435"]
discover = true                 # also look on the usual ports: 11434, 8080, 8000, 1234
vram_reserve_mb = 1024          # kept free on each GPU; models load only within the rest
keep_alive = "30m"              # how long a loaded model stays after its last use

# Mounting and unmounting (disk_mount, disk_unmount).
[disks]
# Mounts no approval can unmount; a disk holding one is never mounted again.
protected = ["/", "/boot", "/boot/*", "/efi", "/usr", "/usr/*", "/var", "/var/*", "/home", "/home/*", "/etc",
             "/opt", "/opt/*", "/srv", "/srv/*", "/root", "/tmp", "/proc", "/proc/*", "/sys", "/sys/*", "/dev",
             "/dev/*", "/run", "/run/user/*", "/run/lock", "/nix", "/nix/*", "/snap/*"]
mount_roots = ["/mnt", "/media", "/run/media"]   # where new mounts may go (and the writable roots)

[audit]
enabled = true
# path = "~/.local/state/orion/audit.jsonl"

# The `orion chat` front-end.
[chat]
provider = "auto"               # auto: route each message; or always "claude" / "local"
                                # (`orion chat --claude/--local/--auto` overrides)
max_tool_rounds = 50            # model calls per message before stopping
show_reasoning = true           # reasoning and progress notes (Ctrl-O toggles)
save_conversations = true       # save after every message; resume with --resume
memory = true                   # remember things about each person across conversations
interface = "tui"               # tui (full screen) or plain (line by line); --plain

# Claude. Needs ANTHROPIC_API_KEY (or ANTHROPIC_AUTH_TOKEN).
[chat.claude]
model = "claude-opus-5-5"
effort = "high"                 # low, medium, high, xhigh, max
max_tokens = 64000
thinking_display = "updates"    # updates (progress notes), summarized, omitted
fallbacks = true                # retry declined requests on another model
base_url = "https://api.anthropic.com"   # ANTHROPIC_BASE_URL overrides

# A model served on this machine, through the OpenAI-compatible API that
# Ollama, llama.cpp (llama-server), vLLM and LM Studio all provide.
[chat.local]
base_url = "http://127.0.0.1:11434/v1"   # Ollama. llama-server: :8080/v1,
                                         # vLLM: :8000/v1, LM Studio: :1234/v1
model = ""                      # empty: the first model the server lists
# max_tokens = 8192             # unset: the server decides
# temperature = 0.6
# api_key_env = "LOCAL_LLM_KEY" # for servers that want a bearer token

# How `auto` picks a model for each message. Private messages stay local and
# short follow-ups ("yes, do it") stay with the last model, both by rule.
# Everything else is judged for complexity: by the local model (strategy =
# "model"), or by the keyword rules below ("rules", and whenever the judge
# fails). Check a decision with `/route <text>`.
[chat.router]
strategy = "model"              # model or rules
classifier_model = ""           # empty: the chat's local model; a small one
                                # (e.g. "qwen3:1.7b") makes routing faster
classifier_timeout_secs = 15
prefer = "local"                # where messages go when nothing points either
                                # way, and the judge's pick when unsure
# Words that make a message private (prefix match, ignoring case).
private_words = ["password", "passwd", "passphrase", "credential", "private key", "api key",
                 "ssn", "social security", "credit card", "bank", "salary", "tax return",
                 "medical", "diagnos", "therapy", "prescription"]
detect_secrets = true           # pasted keys and tokens are private too
# Claude never sees these: messages mentioning them stay local, and Claude's
# tool calls that touch them are refused, whatever the policy allows.
private_paths = ["~/.ssh", "~/.gnupg", "~/.password-store", "~/.aws", "~/.netrc"]
# Used by strategy = "rules", and as the fallback for "model".
complex_words = ["code", "script", "program", "debug", "refactor", "implement", "design",
                 "architect", "plan", "analyze", "analyse", "explain", "compare", "research",
                 "optimize", "optimise", "write", "draft", "review", "why", "strategy",
                 "algorithm", "step by step"]
long_request_words = 60         # longer messages go to Claude

# Voice in the chat: Ctrl-T to talk, `/voice speak on` to hear replies.
# Everything here runs on this machine unless a URL points elsewhere.
[voice]
enabled = true
# Raw 16-bit mono PCM at sample_rate on stdout. Empty: the first of parecord,
# arecord, sox, ffmpeg that is installed.
record_command = ""
sample_rate = 16000
silence_ms = 1200               # a pause this long after speech ends listening (0: never)
max_seconds = 60
# Speech to text: an OpenAI-compatible server (speaches/faster-whisper-server
# on :8000, LocalAI, or whisper.cpp's server with
# --inference-path /v1/audio/transcriptions) ...
transcribe_url = "http://127.0.0.1:8000/v1"
transcribe_model = "Systran/faster-whisper-small"
# ... or a command that prints the transcript ({wav} is the recording):
# transcribe_command = "whisper-cli -m ~/models/ggml-base.en.bin -nt -np -f {wav}"
language = ""                   # e.g. "en"; empty detects it
send_after_transcribe = false   # true: send at once instead of leaving it to edit
# Text to speech, for spoken replies.
speak_replies = false
speak_command = ""              # text on stdin; empty: espeak-ng, espeak or spd-say
# speak_command = "piper --model ~/voices/en_US-amy-medium.onnx --output-raw | aplay -q -r 22050 -f S16_LE -t raw -"
speak_url = ""                  # or an OpenAI-compatible /audio/speech server (Kokoro-FastAPI, speaches)
speak_model = "kokoro"
speak_voice = "af_heart"
play_command = ""               # plays {wav} from speak_url; empty: pw-play, paplay, aplay or ffplay
# api_key_env = "VOICE_API_KEY" # bearer token for servers that want one
# The wake word, in the full-screen chat and the shell: "Orion, …" hands-free.
# Alt-W or `/voice wake on|off` toggles it.
wake = false                    # listen from the start
wake_phrase = "orion"           # "hey orion" and "ok orion" work too
wake_aliases = []               # other spellings your transcriber writes, e.g. ["o'ryan"]
wake_command = ""               # a wake-word detector printing a line per detection,
                                # used instead of transcribing everything said
wake_chime = true               # chime when woken without a request
wake_timeout_secs = 8           # how long to wait for the request after "Orion"
wake_approvals = false          # true: "Orion, yes" approves a tool call ("no" always declines)
wake_allow_remote = false       # allow a transcriber on another machine to hear everything
# Speaker verification: only the voice enrolled with `orion voice enroll` wakes Orion.
verify_speaker = "auto"         # auto: once a voice is enrolled; "on" (required), "off"
verify_method = "auto"          # the neural model when installed (`orion voice model install`),
                                # else built-in; or "neural", "builtin"
verify_similarity = 0.8         # neural: cosine similarity needed; higher is stricter
verify_threshold = 1.2          # built-in: about 1.0 is typical for you; lower is stricter
# What each enrolled person may do by voice (people without an entry may do everything):
# [voice.people.kid]
# tools = "read"                # "all", "read" (only tools that look at the machine), "none"
# approve = false               # may not answer approval prompts by voice
# Headless voice (`orion listen`) always listens and speaks.
listen_new_after_mins = 10      # a new conversation after this long a quiet spell (0: never)

# The graphical shell: `orion shell`, then open the printed address.
[shell]
port = 7310                     # on 127.0.0.1 only; 0 picks a free port
open_browser = false            # or pass --open

# Programs the AI starts (proc_run) run in a sandbox: read-only outside
# fs.write_roots (and /tmp), with the paths below and chat.router.private_paths
# hidden, no network, no GPU, and the limits below. Check with `orion tools`.
[sandbox]
mode = "auto"                   # auto: bubblewrap, else Landlock, else limits only;
                                # or "bubblewrap", "landlock", "off"
require = false                 # true: refuse to run programs with limits only
network = false                 # Landlock can only block TCP; bubblewrap blocks all
gpu = false                     # /dev/nvidia*, /dev/dri, /dev/kfd
memory_mb = 8192                # per program; 0 for no limit
cpu_secs = 300                  # CPU time per program
max_file_mb = 4096              # largest file a program may write
hide = ["~/.ssh", "~/.gnupg", "~/.password-store", "~/.aws", "~/.netrc", "~/.config/orion"]

# `orion daemon`: one policy, audit log and sandbox for every agent. `orion
# serve` connects to it when it is running.
[daemon]
socket = ""                     # empty: $XDG_RUNTIME_DIR/orion/orion.sock

# The privileged helper (`orion helper`, contrib/orion-helper.socket): a root
# service that does Orion's root work, and only that. It reads these settings
# from its own file, /etc/orion/helper.toml, which only root may change;
# Orion reads `socket` from yours.
[helper]
socket = "/run/orion/helper.sock"
group = "orion"                 # members may use it
users = []                      # and these login names
