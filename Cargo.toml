[package]
name = "orion"
version = "0.1.0"
edition = "2021"
description = "Orion: the AI interface layer of an AI-first Linux system, exposed over MCP"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
ratatui = "0.30"
rustyline = "19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
ureq = { version = "2", features = ["native-certs"] }
# Reading and checking the downloaded speaker model.
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

# The speaker-verification tests do real signal processing; unoptimized
# they take several times longer.
[profile.test]
opt-level = 1
