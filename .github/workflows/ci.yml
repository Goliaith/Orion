# Orion's checks: lint, tests, the oldest supported Rust, the package and
# update tools (with rollbacks and unattended updates) against Fedora,
# openSUSE, Arch and Debian in Docker, and the privileged helper as root.
# release.yml builds and tests the release packages.
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"        # nightly, to catch breakage from new distro releases
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages the tests use
        run: sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked

  msrv:
    name: Oldest supported Rust (1.95)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked

  distros:
    name: Package tools on Fedora, openSUSE, Arch and Debian
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools to build the test repositories
        run: sudo apt-get update -q && sudo apt-get install -y -q rpm createrepo-c zstd dpkg-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: tests/distros/run.sh

  helper:
    name: Privileged helper, end to end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Snapper and btrfs, for the snapshots
        run: sudo apt-get update -q && sudo apt-get install -y -q snapper btrfs-progs
      - run: cargo build --locked
      - run: sudo tests/helper/run.sh
